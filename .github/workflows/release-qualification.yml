name: Release qualification
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-qualification
  cancel-in-progress: false
jobs:
  qualification:
    runs-on: [self-hosted, windows, x64, perf-exclusive]
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.85.1 --profile minimal
      - run: cargo build --locked --release
      - run: |
          python ci/scripts/emit_status.py --lane release --status NOT_APPLICABLE --reason "Milestones 2-15 are not implemented"
          python ci/scripts/verify_report.py ci/evidence/release.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: release-evidence-${{ github.sha }}
          path: ci/evidence/
          if-no-files-found: ignore
          retention-days: 90
