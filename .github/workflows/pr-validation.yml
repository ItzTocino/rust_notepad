name: PR validation
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pr-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  correctness:
    # Configure a disposable, per-job self-hosted VM with this label. Never
    # attach persistent credentials or a trusted performance host to PR jobs.
    runs-on: [self-hosted, windows, x64, ephemeral]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.85.1 --profile minimal --component rustfmt --component clippy
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Tests
        run: cargo test --locked --all-targets
      - name: Locked build
        run: cargo build --locked --release
      - name: Create and independently verify evidence
        if: success()
        run: |
          python ci/scripts/emit_status.py --lane correctness --status PASS --reason "All mandatory PR checks completed"
          python ci/scripts/verify_report.py ci/evidence/correctness.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: correctness-evidence-${{ github.sha }}
          path: ci/evidence/
          if-no-files-found: ignore
          retention-days: 14
